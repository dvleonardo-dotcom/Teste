<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marina do Léo</title>
  <meta name="description" content="Marina do Léo — gestão de frota de barcos e marina">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand brand-lg"><span class="brand-mark">⚓</span><div><strong>Marina do Léo</strong><small>Gestão de frota e marina</small></div></div>
      <label>E-mail<input name="email" type="email" required autocomplete="username" placeholder="voce@marinadoleo.com.br"></label>
      <label>Senha<input name="senha" type="password" required autocomplete="current-password"></label>
      <p id="login-erro" class="form-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      <p class="muted small center">Primeiro acesso: <code>admin@marinadoleo.com.br</code> / <code>admin123</code></p>
    </form>
  </div>

  <div id="app" class="layout hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">⚓</span><div><strong>Marina do Léo</strong><small>Gestão náutica</small></div></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button class="btn btn-ghost btn-sm" id="theme-toggle" type="button" title="Alternar tema">◐ Tema</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost icon-btn" id="menu-toggle" type="button" aria-label="Abrir menu">☰</button>
        <h1 id="page-title">Painel</h1>
        <div class="topbar-user">
          <a href="#/perfil" id="user-name" class="user-chip"></a>
          <button class="btn btn-ghost btn-sm" id="logout" type="button">Sair</button>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" id="modal-form" novalidate>
      <header class="modal-head"><h2 id="modal-title"></h2><button class="btn btn-ghost icon-btn" value="cancel" formnovalidate aria-label="Fechar">✕</button></header>
      <div id="modal-body" class="modal-body"></div>
      <p id="modal-erro" class="form-error" role="alert"></p>
      <footer class="modal-foot" id="modal-foot"></footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/js/app.js"></script>
</body>
</html>
